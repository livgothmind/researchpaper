{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}PaperProject{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'images/logo.svg' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            prefix: 'tw-',
            important: true,
            corePlugins: { preflight: false },
            theme: {
                screens: {
                    'sm': '640px',
                    'md': '768px',
                    'lg': '1024px',
                    'xl': '1200px',
                },
                extend: {},
            },
        }
    </script>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=20260325a">
    {% block extra_head %}{% endblock %}
    <script>
        try {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        } catch (e) {}
    </script>
</head>
<body class="max-xl:tw-p-1.5 {% block body_class %}{% endblock %}" {% block body_attrs %}{% endblock %}>

    {% block content %}{% endblock %}

    <button
        class="dark-toggle"
        id="darkToggle"
        aria-label="Toggle dark mode"
        title="Toggle dark mode"
    >
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/>
        </svg>
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
             fill="none" stroke="#f59e0b" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12"    y1="1"     x2="12"   y2="3"/>
            <line x1="12"    y1="21"    x2="12"   y2="23"/>
            <line x1="4.22"  y1="4.22"  x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1"     y1="12"    x2="3"    y2="12"/>
            <line x1="21"    y1="12"    x2="23"   y2="12"/>
            <line x1="4.22"  y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64"  x2="19.78" y2="4.22"/>
        </svg>
    </button>
    <script>
        (function () {
            var btn = document.getElementById('darkToggle');
            if (!btn) return;

            btn.addEventListener('click', function () {
                var root = document.documentElement;
                root.classList.add('theme-switching');
                var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                root.setAttribute('data-theme', next);
                requestAnimationFrame(function () {
                    root.classList.remove('theme-switching');
                });

                try { localStorage.setItem('theme', next); } catch (e) {}
            });
        })();
    </script>

    <script src="{% static 'js/common.js' %}"></script>
    {% block extra_js %}{% endblock %}

</body>
</html>
